<main><div class="container"><h1 class="page-title">Еда и напитки</h1><p class="subtitle">Заказывайте прямо во время игры.</p><div class="grid"><div class="card"><div class="icon">🍔</div><h3>Бургер</h3><div class="price">250 ₽</div><button class="btn" onclick="orderFood('Бургер',250)">Заказать</button></div><div class="card"><div class="icon">🍔</div><h3>Картофель фри</h3><div class="price">150 ₽</div><button class="btn" onclick="orderFood('Картофель фри',150)">Заказать</button></div><div class="card"><div class="icon">🍔</div><h3>Пицца</h3><div class="price">400 ₽</div><button class="btn" onclick="orderFood('Пицца',400)">Заказать</button></div><div class="card"><div class="icon">🍔</div><h3>Кола</h3><div class="price">120 ₽</div><button class="btn" onclick="orderFood('Кола',120)">Заказать</button></div><div class="card"><div class="icon">🍔</div><h3>Энергетик</h3><div class="price">180 ₽</div><button class="btn" onclick="orderFood('Энергетик',180)">Заказать</button></div><div class="card"><div class="icon">🍔</div><h3>Вода</h3><div class="price">80 ₽</div><button class="btn" onclick="orderFood('Вода',80)">Заказать</button></div></div><div id="orders" class="card mt-25"></div></div><script>
function orderFood(name,price){
 if(!requireLogin())return;
 let x=getOrders(); x.push({user:currentUser(),item:name,price:Number(price),time:new Date().toLocaleString('ru-RU')}); saveOrders(x);
 alert('Заказ добавлен: '+name);
 renderOrders();
}
function renderOrders(){
 const box=document.getElementById('orders'); if(!box)return;
 const x=getOrders().filter(o=>o.user===currentUser());
 box.innerHTML=x.length?'<h2>Мои заказы</h2>'+x.map((o,i)=>`<div class="notice">${o.item} — ${o.price} ₽ <small>${o.time}</small></div>`).join(''):'<p class="subtitle">У вас пока нет заказов.</p>';
}
document.addEventListener('DOMContentLoaded',renderOrders);
</script></main>
