<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Бронирование — Cyber Zone</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<header><div class="nav"><a class="logo" href="index.html">CYBER <span>ZONE</span></a><nav><a href="index.html">Главная</a><a href="prices.html">Цены</a><a href="pc.html">ПК</a><a href="games.html">Игры</a><a href="food.html">Еда</a><a href="about.html">О нас</a><a href="contacts.html">Контакты</a><a href="login.html">Вход</a><a class="active" href="booking.html">Бронирование</a></nav></div></header>
<main><div class="container"><h1 class="page-title">Бронирование ПК</h1><p class="subtitle">Выберите тариф, дату и время.</p>
<div class="form"><label>Тариф</label><select id="tariff"><option>Basic</option><option>Pro</option><option>Ultra</option><option>VIP</option></select>
<label>Дата</label><input id="date" type="date"><label>Время</label><input id="time" type="time"><button class="btn" onclick="book()">Забронировать</button></div>
<div id="myBookings" class="card booking-box"></div></div><script>
function book(){
 if(!requireLogin())return;
 const tariff=document.getElementById('tariff').value;
 const date=document.getElementById('date').value;
 const time=document.getElementById('time').value;
 if(!date||!time){alert('Выберите дату и время');return}
 const selected=new Date(date+'T'+time);
 if(isNaN(selected.getTime())||selected<=new Date()){alert('Нельзя бронировать прошедшее время.');return}
 let x=getBookings();
 const conflict=x.some(b=>b.date===date&&b.time===time);
 if(conflict){alert('Это время уже занято. Выберите другое.');return}
 x.push({user:currentUser(),tariff,date,time});saveBookings(x);
 alert('Бронирование успешно сохранено!');renderBookings();
}
function renderBookings(){
 const box=document.getElementById('myBookings');if(!box)return;
 if(!currentUser()){box.innerHTML='<p>Войдите, чтобы увидеть свои бронирования.</p>';return}
 const x=getBookings().filter(b=>b.user===currentUser());
 box.innerHTML='<h2>Мои бронирования</h2>'+(x.length?x.map(b=>`<div class="notice">${b.tariff} — ${b.date} в ${b.time}</div>`).join(''):'<p class="subtitle">Бронирований пока нет.</p>');
}
document.addEventListener('DOMContentLoaded',()=>{
 const d=document.getElementById('date'); if(d)d.min=new Date().toISOString().split('T')[0];
 renderBookings();
});
</script></main>
<footer>© 2026 Cyber Zone — компьютерный клуб</footer>
</body></html>
